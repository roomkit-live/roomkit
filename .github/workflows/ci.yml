name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Bandit
        run: uv run bandit -r src/ -c pyproject.toml

  audit:
    name: Dependency audit (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      # Audit the CORE runtime dependencies only (blocking). Optional extras
      # pull heavier transitive trees and are kept current by Dependabot, so
      # auditing them here would keep the gate permanently red without adding
      # signal for the base install.
      - name: Export core runtime dependencies
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements-core.txt

      - name: pip-audit (core runtime dependencies)
        run: uvx --python 3.12 pip-audit --requirement requirements-core.txt

      # The extras, reported but not gating. Their transitive trees are large
      # and move on other people's schedules, so a blocking check here would
      # be red for reasons no one in this repo can fix — and a gate that is
      # always red is a gate nobody reads. Non-blocking still surfaces a new
      # advisory in the run's output, which is the part that was missing:
      # nothing outside the core was being looked at at all.
      # `--extra all` rather than `--all-extras`: the project declares
      # mutually exclusive extras (neutts / qwen-asr / qwen-tts pin different
      # transformers), so `--all-extras` cannot resolve at all. `--no-hashes`
      # because pip-audit dry-run-installs, and the exported hashes are
      # platform-specific.
      - name: Export optional extras
        continue-on-error: true
        run: uv export --frozen --no-dev --no-emit-project --extra all --no-hashes --format requirements-txt -o requirements-all.txt

      - name: pip-audit (optional extras, non-blocking)
        continue-on-error: true
        run: uvx --python 3.12 pip-audit --requirement requirements-all.txt

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: ty
        run: uv run ty check src/roomkit/

  smoke:
    name: Smoke test (quickstart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install base package only
        run: uv venv && uv pip install .

      - name: Install pytest
        run: uv pip install pytest pytest-asyncio

      - name: Run smoke test
        run: uv run pytest tests/test_smoke_quickstart.py -v

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest --cov --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  # Runs the tests that need real infrastructure — they self-skip in the fast
  # `test` job (no POSTGRES_DSN / no fastapi). This proves the Postgres store,
  # the multi-process index safety (UNIQUE + advisory locks), and the WebRTC
  # auth path against real dependencies.
  integration:
    name: Integration (real Postgres + WebRTC)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roomkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/roomkit_test
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra postgres --extra fastrtc

      # fastapi is a peer dep (WebRTC signaling). The project's fastrtc stack
      # imports the httpx2 compatibility package explicitly, so both transient
      # test dependencies must be present during collection.
      - name: Run integration tests
        run: >-
          uv run --with fastapi --with httpx2 pytest -v
          tests/test_store_postgres.py
          tests/test_postgres_multiprocess.py
          tests/test_webrtc_offer_auth.py
