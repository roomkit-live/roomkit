name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same rule as the `no-downstream-names` commit-msg hook, for commits
      # made where the hook is not installed. A push that creates the branch
      # has no `before`, so only its head commit is checked.
      - name: Commit messages name no downstream application
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$HEAD_SHA^!"
          else
            range="$BEFORE..$HEAD_SHA"
          fi
          if git log --format='%h %B' "$range" | grep -inE '\bluge\b|\bLUG-[0-9]+'; then
            echo "::error::Commit messages must not name a downstream application (see .pre-commit-config.yaml)"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Bandit
        run: uv run bandit -r src/ -c pyproject.toml

  audit:
    name: Dependency audit (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      # Audit the CORE runtime dependencies only (blocking). Optional extras
      # pull heavier transitive trees and are kept current by Dependabot, so
      # auditing them here would keep the gate permanently red without adding
      # signal for the base install.
      - name: Export core runtime dependencies
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements-core.txt

      - name: pip-audit (core runtime dependencies)
        run: uvx --python 3.12 pip-audit --requirement requirements-core.txt

      # The extras, reported but not gating. Their transitive trees are large
      # and move on other people's schedules, so a blocking check here would
      # be red for reasons no one in this repo can fix — and a gate that is
      # always red is a gate nobody reads. Non-blocking still surfaces a new
      # advisory in the run's output, which is the part that was missing:
      # nothing outside the core was being looked at at all.
      # `--extra all` rather than `--all-extras`: the project declares
      # mutually exclusive extras (neutts / qwen-asr / qwen-tts pin different
      # transformers), so `--all-extras` cannot resolve at all. `--no-hashes`
      # because pip-audit dry-run-installs, and the exported hashes are
      # platform-specific.
      - name: Export optional extras
        continue-on-error: true
        run: uv export --frozen --no-dev --no-emit-project --extra all --no-hashes --format requirements-txt -o requirements-all.txt

      - name: pip-audit (optional extras, non-blocking)
        continue-on-error: true
        run: uvx --python 3.12 pip-audit --requirement requirements-all.txt

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: ty
        run: uv run ty check src/roomkit/

      - name: mypy on two-base subclasses of the public classes, ty on the lazy exports
        run: uv run pytest -m typing -q tests/test_typing_subclasses.py tests/test_typing_lazy_exports.py

  smoke:
    name: Smoke test (quickstart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install base package only
        run: uv venv && uv pip install .

      - name: Install pytest
        run: uv pip install pytest pytest-asyncio

      - name: Run smoke test
        run: uv run pytest tests/test_smoke_quickstart.py -v

  # `dev` installs audioop-lts on 3.13 through other extras, and the
  # integration job runs `fastrtc` on 3.12 only: neither sees the WebRTC
  # transport import a module the stdlib dropped. Install the extra alone, as
  # a user does, on the newest Python the test matrix runs.
  fastrtc-extra:
    name: fastrtc extra alone (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the package with the fastrtc extra only
        run: uv venv --python 3.13 && uv pip install ".[fastrtc]" pytest pytest-asyncio

      # Imported outside pytest: the tests importorskip roomkit.webrtc, so a
      # broken import would read as skipped.
      - name: Import the WebRTC transport
        run: .venv/bin/python -c "import roomkit.webrtc"

      # The tests of roomkit.webrtc's users that need nothing beyond the extra
      # (the TestClient ones need httpx2 and run in the integration job).
      - name: Run the WebRTC transport tests
        run: >-
          .venv/bin/python -m pytest -v
          tests/test_webrtc_websocket_g711.py
          tests/test_fastrtc_playback.py
          tests/test_fastrtc_realtime_transport.py
          tests/test_fastrtc_audio_session.py
          tests/voice/realtime/test_fastrtc_transport.py

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -n auto --dist worksteal --cov --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  # The lock pins the newest agent-client-protocol, so the `test` job never
  # runs ACPChannel on the oldest release the `acp` extra accepts. Keep the
  # version below in step with that extra's lower bound in pyproject.toml.
  acp-floor:
    name: ACP SDK floor (agent-client-protocol 0.11.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies at the ACP floor
        run: |
          uv sync --extra dev
          uv pip install agent-client-protocol==0.11.0

      # --no-sync, or uv puts the locked SDK back before running.
      - name: Run ACP tests
        run: uv run --no-sync pytest tests/test_channels -k acp -v

  # Runs the tests that need real infrastructure — they self-skip in the fast
  # `test` job (no POSTGRES_DSN / no fastapi). This proves the Postgres store,
  # the multi-process index safety (UNIQUE + advisory locks), and the WebRTC
  # auth path against real dependencies. Redis recovery, knowledge metadata,
  # shared store contracts and native video decoding are also exercised here,
  # and the turn backend across Redis: its own tests (an executor in another
  # process), then the whole suite with every kit's turns carried by Redis.
  integration:
    name: Integration (real Postgres + WebRTC)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roomkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/roomkit_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra postgres --extra fastrtc --extra redis

      # fastapi is a peer dep (WebRTC signaling). The project's fastrtc stack
      # imports the httpx2 compatibility package explicitly, so both transient
      # test dependencies must be present during collection.
      # A file's POSTGRES_DSN cases run only here: the Redis pass below unsets
      # the DSN and the `test` job has none, so a file left out of this list
      # runs them nowhere. The JUnit report keeps one result per test for the
      # receipts.
      - name: Run integration tests
        run: >-
          uv run --with fastapi --with httpx2 pytest -v
          --junitxml=test-results/integration.xml
          tests/test_store_postgres.py
          tests/conformance/test_postgres.py
          tests/test_postgres_multiprocess.py
          tests/test_verification_release_cancel.py
          tests/test_store_room_contract.py
          tests/test_store_identity_scoping.py
          tests/test_identity_verification.py
          tests/test_kit_close.py
          tests/test_kit_close_doors.py
          tests/test_inbound_connection_budget.py
          tests/test_webrtc_offer_auth.py
          tests/test_webrtc_rtc_configuration.py
          tests/test_store_binding_contract.py
          tests/test_voice_delivery_store.py
          tests/test_knowledge_postgres.py
          tests/delivery/test_redis_integration.py
          tests/test_turns_redis.py
          tests/test_pyav_decode_native.py
          tests/test_fastrtc_audio_session.py
          tests/test_fastrtc_playback.py
          tests/test_fastrtc_realtime_transport.py

      # Writers of one room racing on the server's row locks: deadlock and
      # starvation. Marked stress, so every default pass deselects them;
      # `-m stress` selects them here, on the one server they are about.
      - name: Run the PostgreSQL stress tests
        run: >-
          uv run pytest -v -m stress
          --junitxml=test-results/postgres-stress.xml
          tests/test_store_postgres.py

      - name: Upload the JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-junit
          path: test-results/

      # Every kit built without a turn backend gets one across Redis, its own
      # executor reached there as one elsewhere (tests/redis_turn_mode.py); a
      # test that assumes the kit's process is marked in_process and skipped.
      # The Postgres files ran above; unset, their DSN skips them here.
      - name: Run the suite with the kit's turns across Redis
        env:
          ROOMKIT_TEST_TURN_BACKEND: redis
        run: env -u POSTGRES_DSN uv run --with fastapi --with httpx2 pytest -q -n auto --dist worksteal
